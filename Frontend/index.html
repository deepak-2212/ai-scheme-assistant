<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovScheme AI Assistant</title>
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <div class="logo-container">
                    <i class="fa-solid fa-landmark"></i>
                </div>
                <div class="header-titles">
                    <h1 id="app-title">Scheme Assistant</h1>
                    <span class="status"><span class="status-dot"></span> AI Online</span>
                </div>
            </div>
            <div class="header-right">
                <button id="lang-toggle" class="lang-btn" aria-label="Toggle Language">
                    <span class="lang-icon">A/अ</span>
                    <span class="lang-text" id="lang-ind">EN</span>
                </button>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-wrapper" id="chat-wrapper">
            <div class="chat-feed" id="chat-feed">
                <!-- Initial Welcome Message -->
                <div class="message ai-message">
                    <div class="message-avatar">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="message-content">
                        <p class="text-bubble" id="welcome-text">
                            Hello! I am your AI Government Scheme Assistant.<br><br>
                            Tell me a bit about yourself (e.g., "I am a farmer from Maharashtra earning ₹1 lakh
                            annually"), and I will find the best schemes you are eligible for.
                        </p>
                        <div style="margin-top:10px;">
                            <button onclick="document.getElementById('chat-input').value='I am a farmer'; document.getElementById('chat-input').focus();">🌾 Farmer</button>
                            <button onclick="document.getElementById('chat-input').value='I am a student'; document.getElementById('chat-input').focus();">🎓 Student</button>
                        </div>
                    </div>
                </div>
                <!-- Dynamic messages go here -->
            </div>
        </main>

        <!-- Input Area -->
        <footer class="input-area">
            <div class="input-container">
                <input type="text" id="chat-input" class="chat-input" placeholder="Type your message here..." autocomplete="off">
                <button class="action-btn icon-send" id="send-btn" title="Send Message">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <div class="footer-note">
                <i class="fa-solid fa-shield-halved"></i>
                <span id="privacy-note">Your information is secure and private.</span>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
